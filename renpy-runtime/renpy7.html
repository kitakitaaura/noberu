    <style>
      body {
        font-family: arial;
        margin: 0;
        padding: none;
        background: #000;
        overflow: hidden;
      }

      /* The tab handles saves and fullscreen, so Ren'Py's own menu is hidden. */
      #ContextContainer { display: none; }
      #emscripten_logo { display: none; }

      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      div.emscripten { text-align: center; }
      div.emscripten_border { border: 1px solid black; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten { border: 0px none; background-color: black; width: 100vw; height: 100vh; }

      #emscripten_logo {
        display: inline-block;
        margin: 0;
      }

      .spinner {
        height: 30px;
        width: 30px;
        vertical-align: top;
        position: absolute;

        -webkit-animation: rotation .8s linear infinite;
        -moz-animation: rotation .8s linear infinite;
        -o-animation: rotation .8s linear infinite;
        animation: rotation 0.8s linear infinite;

        border-left: 5px solid rgb(235, 235, 235);
        border-right: 5px solid rgb(235, 235, 235);
        border-bottom: 5px solid rgb(235, 235, 235);
        border-top: 5px solid rgb(120, 120, 120);

        border-radius: 100%;
        background-color: rgb(189, 215, 46);
      }

      @-webkit-keyframes rotation {
        from {-webkit-transform: rotate(0deg);}
        to {-webkit-transform: rotate(360deg);}
      }
      @-moz-keyframes rotation {
        from {-moz-transform: rotate(0deg);}
        to {-moz-transform: rotate(360deg);}
      }
      @-o-keyframes rotation {
        from {-o-transform: rotate(0deg);}
        to {-o-transform: rotate(360deg);}
      }
      @keyframes rotation {
        from {transform: rotate(0deg);}
        to {transform: rotate(360deg);}
      }

      #statusbar_container {
        position: fixed;
        top: 0;
        width: 100%;
        margin: auto;
      }

      #statusbar {
        width: 50%;
        margin: auto;
        min-width: 340px;
        padding: 10px;
        height: 40px;
        background-color: rgb(40, 40, 40);
      }

      #status {
        vertical-align: top;
        font-weight: bold;
        color: rgb(120, 120, 120);
        width: 100%;
        padding-bottom: 2px;
        text-align: left;
      }

      #progress {
        height: 20px;
        width: 100%;
      }


      #ContextContainer {
        position: absolute;
        left: 10px;
        top: 10px;
        color: white;
      }
      #ContextButton {
        text-decoration: none;
        color: grey;
        font-size: xx-large;
        cursor: pointer;
        user-select: none;
        -moz-user-select: none;
      }
      #ContextButton:focus {
        outline: none;
      }
      #ContextMenu a {
        text-decoration: none;
        color: lightgrey;
      }
      #ContextMenu a:hover {
        text-decoration: nsone;
        color: grey;
      }
      #ContextMenu {
        background-color: rgb(40,40,40);
        padding: 5px;
      }
    </style>

    <script type='text/javascript'>
      /* Copyright (C) 2018, 2019, 2020, 2021  Sylvain Beucler */

      /* Context menu */
      const menu = document.getElementById('ContextMenu');
      document.getElementById('ContextButton').addEventListener('click', function (e) {
        if (menu.style.display == 'none')
          menu.style.display = 'block';
        else
          menu.style.display = 'none';
        e.preventDefault();
      });

      menu.addEventListener('click', function (e) {
        if (e.target.tagName == 'A') {
          // Close context menu when a menu item is selected
          menu.style.display = 'none';
        }
      });

      function onSavegamesImport(input) {
        reader = new FileReader();
        reader.onload = function(e) {
          FS.writeFile('savegames.zip', new Uint8Array(e.target.result));
          Module._emSavegamesImport();
          FS.syncfs(false, function(err) {
            if (err) {
              console.trace(); console.log(err, err.message);
              Module.print("Warning: cannot import savegames: write error: " + err.message + "\n");
            } else {
                renpy_exec('renpy.loadsave.location.scan()').then(result => {
                  Module.print("Saves imported successfully\n");
                }).catch(error => {
                  console.error('Cannot rescan saves folder', error);
                  Module.print("Saves imported - restart game to apply.\n");
                });
            }
          });
        }
        reader.readAsArrayBuffer(input.files[0])
	input.type = ''; input.type = 'file'; // reset field
      }

      function onSavegamesExport() {
        ret = Module._emSavegamesExport();
        if (ret) {
          FSDownload('savegames.zip', 'application/zip');
        }
      }

      function gameExtractAndRun() {
        start = Date.now();
        var ret = Module.ccall('PyRun_SimpleString', 'number', ['string'], [
          "import zipfile\n" +
          "zip_ref = zipfile.ZipFile('game.zip', 'r')\n" +
          "zip_ref.extractall('.')\n" +
          "zip_ref.close()\n"
        ])
        if (ret != 0) {
            Module.setStatus("Error extracting .zip.");
            return;
        }
        FS.unlink('/game.zip')
        Module.print("Extracted in " + (Date.now()-start)/1000.0 + "s\n");

        if (FS.readdir('/').indexOf('game') < 0) {
            Module.setStatus("Invalid .zip (no top-level 'game' directory).");
            return;
        }

        // presplash
        presplash = undefined;
        if (FS.readdir('/').indexOf('web-presplash.png') >= 0) {
          presplash = FS.readFile('/web-presplash.png');
        } else if (FS.readdir('/').indexOf('web-presplash.jpg') >= 0) {
          presplash = FS.readFile('/web-presplash.jpg');
        } else if (FS.readdir('/').indexOf('web-presplash.webp') >= 0) {
          presplash = FS.readFile('/web-presplash.webp');
        } else if (FS.readdir('/').indexOf('web-presplash-default.jpg') >= 0) {
          presplash = FS.readFile('/web-presplash-default.jpg');
        }

        div = document.createElement('div');
        div.id = 'presplash';  // used by presplashEnd()
        div.style = 'position: absolute; width: 100%; height: 100%';
        c = document.getElementById('canvas');
        c.parentElement.prepend(div);

        if (presplash) {
          obj_url = window.URL.createObjectURL(new Blob([presplash]));
          img = document.createElement('img');
          img.src = obj_url;
          img.style = 'display: block; margin: auto; width: 100%; height: 100%; object-fit: contain';
          div.appendChild(img)
        } else {
          Module.print("Loading game, please wait...\n");
        }

        // give control back to webui before running main
        window.setTimeout(function() {
          Module.ccall('pyapp_runmain', '', [], [], {async: true})
        }, 200);  // smaller delay doesn't update the DOM, esp. on mobile
      }

      // hook for Ren'Py
      function presplashEnd() {
        document.getElementById('presplash').remove();
      }
      function FSDownload(filename, mimetype) {
        console.log('download', filename);
        var a = document.createElement('a');
        a.download = filename.replace(/.*\//, '');
        try {
          a.href = window.URL.createObjectURL(new Blob([FS.readFile(filename)],
                                                       { type: mimetype || '' }));
        } catch(e) {
          Module.print("Error opening " + filename + "\n");
          return;
        }
        document.body.appendChild(a);
        a.click();
        // delay clean-up to avoid iOS issue:
        // The operation couldn’t be completed. (WebKitBlobResourse error 1.)
        setTimeout(function() {
            window.URL.revokeObjectURL(a.href);
            document.body.removeChild(a);
        }, 1000);
      }
    </script>
    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');

      var Module = {
        // The engine and its data packages live in v7/, but everything here
        // resolves against this document. Without this Python starts with no
        // standard library ("No module named site") and quits before the game
        // is ever extracted.
        locateFile: function (path) { return "v7/" + path; },
        preRun: [],
        postRun: [],
        print: (function() {
          var element = document.getElementById('status');
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            console.log(text);
            // These replacements are necessary if you render to raw HTML
            text = String(text);
            text = text.replace(/&/g, "&amp;");
            text = text.replace(/</g, "&lt;");
            text = text.replace(/>/g, "&gt;");
            text = text.replace('\n', '<br />', 'g');
            element.innerHTML += text;

            statusbar = document.getElementById('statusbar');
            statusbar.hidden = false;
            var print_date = new Date();
            statusbar.date = print_date;
            window.setTimeout(function() {
              // Hide status bar after a few seconds - only if setStatus isn't active
              if (Module.setStatus.last && Module.setStatus.last.text == ''
                  && statusbar.date == print_date) {
                element.innerHTML = ''; statusbar.hidden = true;
              }
            }, 3000);
          };
        })(),
        printErr: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          if (0) { // XXX disabled for safety typeof dump == 'function') {
            dump(text + '\n'); // fast, straight to the real console
          } else {
            console.error(text);
          }
        },
        canvas: (function() {
          var canvas = document.getElementById('canvas');

          // As a default initial behavior, pop up an alert when webgl context is lost. To make your
          // application robust, you may want to override this behavior before shipping!
          // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);

          return canvas;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.style.display = 'none';
          }
          if (text == '') {
            statusElement.innerHTML = '';
            document.getElementById('statusbar').hidden = true;
          } else {
            statusElement.innerHTML = text + '<br />';
            document.getElementById('statusbar').hidden = false;
          }
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');
      window.onerror = function(event) {
        // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
        //Module.setStatus('Exception thrown, see JavaScript console');
        // Explicitly display meaningful errors such as "uncaught exception: out of memory":

        var appleWarning = "";

        if (/RangeError/.test(event)) {
            appleWarning = "\n<p>This is a known issue with this beta and recent changes to some web browsers. Reloading this page with developer tools open may help.";
        }

        Module.setStatus('Error: ' + event.split('\n')[0] + ' (see JavaScript console for details)' + appleWarning);
        spinnerElement.style.display = 'none';
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
      };
    </script>

    <script type='text/javascript'>
        /* This block contains code for running Python statements
        * in Ren'Py process from JS.
        *
        * Copyright 2022 Teyut <teyut@free.fr>, MIT License.
        */

        (function() {
          let cmd_queue = [];
          let cur_cmd = undefined;
          let debug = false;

          function dbg_log(...args) {
            if(debug) console.debug(...args);
          }

          /** This functions is called by the wrapper script at the end of script execution. */
          function cmd_callback(result) {
            dbg_log('cmd_callback', result);

            if(cur_cmd === undefined) {
              console.error('Unexpected command result', result);
              return;
            }

            try {
              if(result.error !== undefined) {
                dbg_log('ERROR', result.name, result.error, result.traceback);
                const e = new Error(result.error);
                e.name = result.name;
                e.traceback = result.traceback;
                cur_cmd.reject(e);
              } else {
                dbg_log('SUCCESS', result.data);
                cur_cmd.resolve(result.data);
              }
            } finally {
              cur_cmd = undefined;
              send_next_cmd();
            }
          }

          /** Prepare and send the next command to be executed if any. */
          function send_next_cmd() {
            if(cmd_queue.length == 0) return

            cur_cmd = cmd_queue.shift();
            dbg_log('send_next_cmd', cur_cmd);

            // Convert script to base64 to prevent having to escape
            // the script content as a Python string
            const script_b64 = btoa(cur_cmd.py_script);
            const wrapper = 'import base64, emscripten, json, traceback;\n'
                + 'try:'
                + "result = None;"
                + "exec(base64.b64decode('" + script_b64 + "').decode('utf-8'));"
                + "result = json.dumps(dict(data=result));"
                + "\n"
                + "except Exception as e:"
                + "result = json.dumps(dict(error=str(e), name=e.__class__.__name__, traceback=traceback.format_exc()));"
                + "\n"
                + "emscripten.run_script('_renpy_cmd_callback(%s)' % (result,));";

            dbg_log(wrapper);

            // Write script to the global variable Ren'Py is monitoring
            window._renpy_cmd = wrapper;
          }

          /** Add a command to the queue and execute it if the queue was empty. */
          function add_cmd(py_script, resolve, reject) {
            const cmd = {py_script: py_script, resolve: resolve, reject: reject};
            dbg_log('add_cmd', cmd);
            cmd_queue.push(cmd);

            if(cur_cmd === undefined) send_next_cmd();
          }

          /* Global definitions */

          /** Execute Python statements in Ren'Py Python's thread. The statements are executed
           * using the renpy.python.py_exec() function, and the value of the "result" variable
           * is passed to the resolve callback. In case of error, an Error instance is passed
           * to the reject callback, with an extra "traceback" property.
           * @param py_script The Python script to execute.
           * @return A promise which resolves with the statements result.
           */
          renpy_exec = function(py_script) {
            return new Promise((resolve, reject) => {
              add_cmd(py_script, resolve, reject);
            });
          };

          /** Helper function to get the value of a Ren'Py variable.
           * @param name The variable name (e.g., "build.name").
           * @return A promise which resolves with the variable value.
           */
          renpy_get = function(name) {
            return new Promise((resolve, reject) => {
              renpy_exec('result = ' + name)
                  .then(resolve).catch(reject);
            });
          };

          /** Helper function to set the value of a Ren'Py variable.
           * @param name The variable name (e.g., "build.name").
           * @param value The value to set. It should either be a basic JS type that
           *              will be converted to JSON, or a Python expression. The raw
           *              parameter must be set to true for the latter case.
           * @param raw (optional) If true, value is a valid Python expression.
           *            Otherwise, it must be a basic JS type.
           * @return A promise which resolves with true in case of success
           *         and fails otherwise.
           */
          renpy_set = function(name, value, raw) {
            let script;
            if(raw) {
              script = name + " = " + value + "; result = True";
            } else {
              // Using base64 as it is unclear if we can use the output
              // of JSON.stringify() directly as a Python string
              script = 'import base64, json; '
                  + name + " = json.loads(base64.b64decode('"
                  + btoa(JSON.stringify(value))
                  + "').decode('utf-8')); result = True";
            }
            return new Promise((resolve, reject) => {
              renpy_exec(script)
                  .then(resolve).catch(reject);
            });
          };

          _renpy_cmd_callback = cmd_callback;

          /** Stubs for web3 functionality. */
          window.loadCache = () => { };
          window.clearCache = () => { };
          window.webglContextLost = false;
          window.webglContextRestored = false;

        })();
    </script>

    <script type='text/javascript'>
      function create_persistent() {
        // populate savegames
        try {
          FS.mkdir('/home/web_user/.renpy');
          FS.mount(IDBFS, {}, '/home/web_user/.renpy');
        } catch(e) {
          console.log(e);
          Module.print("Could not create ~/.renpy/ : " + e.message + "\n");
        }
        FS.syncfs(true, function(err) {
          if (err) {
              console.trace(); console.log(err, err.message);
              // Note: not visible enough, quickly replaced by loading status
              Module.print("Warning: cannot save games\n");
          }
        });
      }
      if (Module['calledRun']) {
        create_persistent();
      } else {
        if (!Module['preRun']) Module['preRun'] = [];
        Module["preRun"].push(create_persistent); // FS is not initialized yet, wait for it
      }

    /***************************************************************************
     * Fetch.
     ***************************************************************************/

    let fetchId = 1;
    let fetchResult = { };

    /**
     * Fetch a file from the server.
     *
     * @param method The HTTP method to use.
     * @param url The URL to fetch.
     * @param inFile The file to send to the server. A string giving the file name, or null for no file.
     * @param outFile The file to write the response to. A string giving the file name, or null for no file.
     * @param inContentType The content type of the file to send to the server. A string giving the content type. Ignored if inFile is null.
     * @param headers A string containing a JSON object that contains the headers to send to the server.
     *
     * @return A string giving the result of the fetch. The first word is the status, which is one of "OK", "ERROR", or "PENDING", followed by the HTTP status code and status text.
     */
     function fetchFile(method, url, inFile, outFile, inContentType, headers) {

        let id = fetchId++;
        fetchResult[id] = "PENDING Fetch in progress.";

        // Ensure headers exists and is not a copy.
        if (headers) {
            headers = JSON.parse(headers)
        } else {
            headers = { };
        }

        headers = { ...headers };

        async function fetchFileWork() {
            try {

                let content = ''

                if (inFile) {
                    headers["Content-Type"] = inContentType || 'application/octet-stream';
                }

                let options = { method: method, headers: headers};

                if (inFile) {
                    options.body = FS.readFile(inFile, { encoding: 'binary' });
                }

                let response = await fetch(url, options);

                if (response.ok) {
                    if (outFile) {
                        let ab = await response.arrayBuffer();
                        FS.writeFile(outFile, new Uint8Array(ab));
                    }

                    fetchResult[id] = "OK " + response.status + " " + response.statusText;
                } else{
                    fetchResult[id] = "ERROR " + response.status + " " + response.statusText;
                }

            } catch (err) {
                fetchResult[id] = "ERROR " + err;
                console.error(err);
            }

        }

        fetchFileWork();

        return id;
    }

    function fetchFileResult(id) {
        let result = fetchResult[id];

        if (! result.startsWith("PENDING")) {
            delete fetchResult[id];
        }

        return result || "ERROR Fetch ID not found.";
    }

    window.fetchFile = fetchFile;
    window.fetchFileResult = fetchFileResult;

    /**
     * Fullscreen support.
     */

    let lastFullscreenTime = 0;

    function isFullscreen() {
        let now = +new Date();
        return document.fullscreenElement ? 1 : 0;
    }

    window.isFullscreen = isFullscreen;

    function setFullscreen(enable) {

        let current = document.fullscreenElement !== null;

        if (enable == current) {
            return;
        }

        let now = +new Date();

        if (lastFullscreenTime + 250 > +new Date()) {
            return;
        }

        lastFullscreenTime = now;

        setTimeout(function () {
            if (enable) {
                let e = document.getElementsByTagName("html")[0];
                e.requestFullscreen().catch(function (error) {
                    lastFullscreenTime = now + 15000;
                });
            } else {
                document.exitFullscreen();
            }
        }, 0);
    }

    window.setFullscreen = setFullscreen;

    </script>

    <script>
      // The page loaded in an iframe by the "ren'py" tab in ../index.html when
      // the picked game is Ren'Py 7 or older. Everything above this script is
      // Ren'Py's own 7.8.7 web shell, edited only where noted; v7/ holds the
      // stock index.js / index.wasm / *.data from its web support package.
      //
      // Host entry point:
      //   window.RenPyInstallAndBoot(root, files) - `files` is the FileList
      //   from the tab's directory picker.
      // Status goes to the parent as
      // postMessage({ source: "renpy-runtime", type, ... }), the same shape
      // the 8.x page uses, so the tab does not care which one it loaded.

      const ENGINE_ZIP = "v7/engine-7.8.7.zip";
      const ENGINE_VERSION = [7, 8, 7];

      // Past this the wasm heap is likely to run out while unpacking. This
      // build is 32-bit with a lower ceiling than the 8.x one, so warn earlier.
      const BIG_GAME_BYTES = 900 * 1024 * 1024;

      // Render at 1 CSS pixel per game pixel. SDL otherwise sizes the canvas by
      // devicePixelRatio, so a 1920x1080 game renders at 3840x2160 on a Retina
      // screen - 4x the pixels - and is then scaled straight back down to fit.
      // This build has no threads, so that cost lands on the one frame thread
      // and shows up as lag.
      //
      // ?scale=N overrides it: below 1 the game renders smaller and the browser
      // scales it up, which is the lever for a heavy game. "native" restores the
      // browser's own ratio.
      const scaleParam = new URLSearchParams(location.search).get("scale");
      if (scaleParam !== "native") {
        const scale = Math.min(2, Math.max(0.25, parseFloat(scaleParam) || 1));
        Object.defineProperty(window, "devicePixelRatio", { get: () => scale });
      }
      // Readable from outside the page's JS world, for debugging.
      document.documentElement.dataset.renpyDpr = String(window.devicePixelRatio);


      // Stand-ins for desktop-only modules that older games import. The engine
      // is unpacked at / and runs /main.py, so / is first on sys.path.
      //
      // fcntl: DDLC's singleton.py locks a file so a second copy of the game
      // refuses to start. A browser tab has no second copy to stop, so the
      // lock can always succeed.
      const SHIMS = {
        "/fcntl.py":
          "# noberu: browsers have no fcntl; one tab is one instance.\n" +
          "LOCK_SH, LOCK_EX, LOCK_NB, LOCK_UN = 1, 2, 4, 8\n" +
          "F_GETFD, F_SETFD, F_GETFL, F_SETFL = 1, 2, 3, 4\n" +
          "FD_CLOEXEC = 1\n" +
          "def lockf(fd, operation, length=0, start=0, whence=0): return None\n" +
          "def flock(fd, operation): return None\n" +
          "def fcntl(fd, op, arg=0): return 0\n" +
          "def ioctl(fd, op, arg=0, mutate_flag=True): return 0\n",
      };

      function installShims(FS) {
        for (const [path, source] of Object.entries(SHIMS)) {
          try {
            FS.stat(path);
          } catch (error) {
            FS.writeFile(path, source);
          }
        }
      }

      function post(type, detail) {
        window.parent.postMessage(
          Object.assign({ source: "renpy-runtime", type: type }, detail || {}), "*");
      }

      function status(text) {
        post("status", { text: text });
      }

      // Ren'Py's shell writes progress into #status; mirror it to the tab
      // until the game is actually up, after which the tab would keep
      // redrawing its overlay over a running game.
      const statusEl = document.getElementById("status");
      const statusMirror = new MutationObserver(() => {
        const text = statusEl.textContent.trim().split(/\s{2,}|\n/).pop();
        if (text) status(text);
      });
      statusMirror.observe(statusEl, { childList: true, subtree: true, characterData: true });

      // Ren'Py calls this once the game has drawn its first frame, which is
      // the real "running" moment - index.js loading only means the engine
      // started downloading itself.
      const shellPresplashEnd = window.presplashEnd;
      window.presplashEnd = function () {
        statusMirror.disconnect();
        try {
          shellPresplashEnd();
        } finally {
          post("running", {});
          document.getElementById("canvas").focus();
          applyPerformancePreferences();
          reportSaveDirectory();
        }
      };

      // Ren'Py names a game's save folder after config.save_directory, which
      // lives in the compiled scripts (DDLC's is "DDLC-1454445547"). Tell the
      // host, so the saves panel and beam can match the folder to the game.
      function reportSaveDirectory() {
        try {
          Module.ccall("PyRun_SimpleString", "number", ["string"], [
            "import renpy\n" +
            "open('/tmp/noberu-save-directory', 'w').write(renpy.config.save_directory or '')\n"
          ]);
          const name = FS.readFile("/tmp/noberu-save-directory", { encoding: "utf8" });
          if (name) post("save-directory", { name: name });
        } catch (error) {
          console.warn("[renpy] could not read the save directory", error);
        }
      }

      // Ren'Py's own Shift+G screen offers a renderer choice, powersave and a
      // framerate cap. Only the last two mean anything here: on Emscripten the
      // renderer is always GLES2, and the "Force ANGLE2" option desktop guides
      // recommend is Windows-only (ANGLE translates GL to Direct3D; the
      // browser already does its own translation).
      //
      // Powersave drops the framerate when Ren'Py thinks the game is idle,
      // which on a laptop reads as stutter. This build has no renpy_exec, so
      // the preference is set through the interpreter directly.
      function applyPerformancePreferences() {
        try {
          Module.ccall("PyRun_SimpleString", "number", ["string"], [
            "import renpy\n" +
            "renpy.game.preferences.gl_powersave = False\n" +
            "renpy.game.preferences.gl_framerate = None\n"
          ]);
        } catch (error) {
          console.warn("[renpy] could not set performance preferences", error);
        }
      }

      let started = false;

      async function boot(root, fileList) {
        if (started) return;
        started = true;

        const staged = await NoberuRenPyStage.prepare({
          fileList: fileList,
          checkVersion: (version) => {
            if (version && version[0] >= 8) {
              throw new Error(
                `This is a Ren'Py ${version.join(".")} game, and this is the Ren'Py ` +
                `${ENGINE_VERSION.join(".")} runtime. The ren'py tab picks the 8.x runtime ` +
                "for those; loading this page directly skips that choice.");
            }
          },
        });

        if (staged.bytes > BIG_GAME_BYTES) {
          post("warning", {
            message: `This game is ${Math.round(staged.bytes / (1024 * 1024))} MB, which has to ` +
              "fit in memory all at once. It may run out and crash.",
          });
        }

        // Only the engine goes through the zip; the game is written into the
        // filesystem below, so it is never held twice.
        DEFAULT_GAME_FILENAME = ENGINE_ZIP;

        // The engine waits for this before it starts the game. The shell's
        // extraction check wants a top-level game/ directory, which install()
        // creates.
        Module.preRun.push(function () {
          Module.addRunDependency("installGame");
          NoberuRenPyStage.install(Module.FS || FS, staged, status, root)
            .then(() => {
              installShims(Module.FS || FS);
              Module.removeRunDependency("installGame");
            })
            .catch((error) => {
              post("error", { message: "Could not install the game: " + error.message });
            });
        });

        status("loading the Ren'Py 7 engine...");
        post("booting", {});

        // index.js fetches DEFAULT_GAME_FILENAME itself once the runtime is
        // initialised, then calls gameExtractAndRun() above.
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "v7/index.js";
          script.onload = resolve;
          script.onerror = () => reject(new Error("Failed to load v7/index.js"));
          document.body.appendChild(script);
        });

        // "running" is posted from presplashEnd above, not here.
      }

      window.RenPyInstallAndBoot = async function (root, fileList) {
        try {
          await boot(root, fileList);
        } catch (error) {
          console.error(error);
          post("error", { message: String((error && error.message) || error) });
        }
      };

      (async function autoload() {
        const name = new URLSearchParams(location.search).get("autoload");
        if (!name || !/^[\w-]+$/.test(name)) return;
        try {
          await boot(name, await NoberuRenPyDev.load(name));
        } catch (error) {
          console.error(error);
          post("error", { message: String((error && error.message) || error) });
        }
      })();
    </script>
  </body>
</html>
