<!doctype html>
<html lang="en">

<head>
  <!-- noberu runtime hooks (volume, sharp pixels): before any engine code (assets/runtime.js) -->
  <script src="../assets/runtime.js"></script>
  <meta charset="utf-8">
  <title>rlvm runtime</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* Centred at the game's own shape, black around it; fitCanvas() below
       sets the size. Never stretched to the frame: a phone's frame is the
       whole screen, nothing like 4:3 or 16:9. */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* Crash details (showCrash below), so a phone can report what failed. */
    #crash {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      max-height: 55vh;
      margin: 0;
      padding: 10px;
      overflow: auto;
      background: #111;
      color: #ddd;
      border: 1px solid #444;
      border-radius: 8px;
      font: 11px/1.4 ui-monospace, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text;
      -webkit-user-select: text;
    }

    #crash button {
      float: right;
      font: inherit;
      padding: 4px 10px;
    }
  </style>
</head>

<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    // The page loaded in an iframe by the "rlvm" tab in ../index.html. rlvm is
    // a RealLive virtual machine (Key's engine: Kanon, Air, Clannad, Little
    // Busters, Planetarian) cross-compiled to wasm; see ../../Noberu for the
    // engine sources and build.
    //
    // The host tab stages a game folder and calls the entry point below, same
    // arrangement as ../vnds-runtime/vnds.html:
    //   window.RLVMInstallAndBoot(root, files) - `files` is the FileList from
    //   the tab's directory picker. Files are read on demand, only when the
    //   engine opens them (see stageGameFiles below).
    // Status is reported to the parent with
    // postMessage({ source: "rlvm-runtime", type, ... }).

    const canvasEl = document.getElementById("canvas");

    // The last console lines, shown with a crash. A phone has no console to
    // look at, and the engine's own log says how far it got.
    const recentLog = [];
    for (const level of ["log", "warn", "error"]) {
      const original = console[level].bind(console);
      console[level] = (...args) => {
        recentLog.push(args.map(String).join(" ").slice(0, 300));
        if (recentLog.length > 40) recentLog.shift();
        original(...args);
      };
    }

    function crashReport(error) {
      const lines = [String((error && error.message) || error), ""];
      if (error && error.stack) lines.push("stack:", ...String(error.stack).split("\n").slice(0, 40), "");
      lines.push("ua: " + navigator.userAgent);
      lines.push(`screen: ${innerWidth}x${innerHeight} @${devicePixelRatio}, canvas ${canvasEl.width}x${canvasEl.height}`);
      try {
        lines.push("heap MB: " + window.wasmMemory.buffer.byteLength / 1048576);
      } catch (e) {}
      try {
        lines.push("lazyFS: " + JSON.stringify(window.Module.lazyFS.stats()));
      } catch (e) {}
      try {
        const gl = document.createElement("canvas").getContext("webgl");
        const info = gl.getExtension("WEBGL_debug_renderer_info");
        lines.push("gl: " + (info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)) +
          ", max texture " + gl.getParameter(gl.MAX_TEXTURE_SIZE));
      } catch (e) {}
      lines.push("", "last log lines:", ...recentLog);
      return lines.join("\n");
    }

    let crashShown = false;
    function showCrash(error) {
      if (crashShown) return;
      crashShown = true;
      const text = crashReport(error);
      const box = document.createElement("pre");
      box.id = "crash";
      const copy = document.createElement("button");
      copy.type = "button";
      copy.textContent = "copy";
      copy.onclick = () => navigator.clipboard.writeText(text).then(() => { copy.textContent = "copied"; }, () => {});
      box.append(copy, text);
      document.body.appendChild(box);
    }
    window.addEventListener("error", (event) => showCrash(event.error || event.message));
    window.addEventListener("unhandledrejection", (event) => showCrash(event.reason));

    // The largest box of the game's shape (its canvas resolution, which SDL
    // sets) that fits the frame. SDL maps pointer positions through the
    // canvas's on-screen box, so resizing the element itself keeps clicks
    // lined up, where object-fit would not.
    function fitCanvas() {
      const w = canvasEl.width;
      const h = canvasEl.height;
      if (!w || !h || w === 300 && h === 150) return;  // not sized by SDL yet
      const scale = Math.min(window.innerWidth / w, window.innerHeight / h);
      canvasEl.style.width = `${Math.floor(w * scale)}px`;
      canvasEl.style.height = `${Math.floor(h * scale)}px`;
    }
    window.addEventListener("resize", fitCanvas);
    new MutationObserver(fitCanvas).observe(canvasEl, { attributes: true, attributeFilter: ["width", "height"] });

    function post(type, detail) {
      window.parent.postMessage(
        Object.assign({ source: "rlvm-runtime", type: type }, detail || {}), "*");
    }

    let modulePromise = null;

    // The walkthrough picks an option of the choice on screen; true if taken.
    window.noberuSelect = (index) =>
      !!(window.Module && window.Module.ccall && window.Module.ccall("rlvm_select", "number", ["number"], [index]));

    // Loads rlvm.js (the Emscripten glue) once and resolves when its runtime,
    // including the /game, /fonts and IDBFS-backed /home mounts, is ready.
    function loadModule() {
      if (modulePromise) return modulePromise;

      modulePromise = new Promise((resolve, reject) => {
        window.Module = {
          canvas: canvasEl,
          print: (text) => console.log("[rlvm]", text),
          printErr: (text) => console.error("[rlvm]", text),
          onAbort: (what) => reject(new Error("rlvm aborted: " + what)),
          // Each line, and who said it, at every click wait (UTF-8), for
          // noberu's reading tools (assets/text.js).
          noberuText: (text, name) => {
            if (!window.NoberuSay) return;
            const decoder = new TextDecoder("utf-8");
            window.NoberuSay({ text: decoder.decode(text), name: decoder.decode(name), kind: "line" });
          },
          // A choice on screen ({seen, line, pos, options}) and the pick that
          // closed it, for noberu's walkthrough (assets/walkthrough.js),
          // which answers through window.noberuSelect.
          noberuChoice: (json) => {
            const host = window.top && window.top.NoberuWalkthrough;
            if (host) host.choice(window, JSON.parse(json));
          },
          noberuChoiceMade: (index) => {
            const host = window.top && window.top.NoberuWalkthrough;
            if (host) host.made(window, index);
          },
          preRun: [
            function setUpVirtualFilesystem() {
              // Free identifiers inside the Emscripten module closure
              // (FS/IDBFS/ENV), not properties of Module.
              FS.mkdir("/game");
              FS.mkdir("/fonts");
              // /home already exists in Emscripten's MEMFS; mount over it so
              // saves persist in this browser's IndexedDB.
              FS.mount(IDBFS, {}, "/home");
              ENV.HOME = "/home";

              addRunDependency("rlvm-idbfs-load");
              FS.syncfs(true, (err) => {
                if (err) console.error("IDBFS initial sync failed", err);
                removeRunDependency("rlvm-idbfs-load");
              });
            },
          ],
          onRuntimeInitialized: () => resolve(Module),
        };

        const script = document.createElement("script");
        script.src = "rlvm.js";
        script.onerror = () => reject(new Error("Failed to load rlvm.js"));
        document.body.appendChild(script);
      });

      return modulePromise;
    }

    let fallbackFontLoaded = false;
    async function ensureFallbackFont(Mod) {
      if (fallbackFontLoaded) return;
      const response = await fetch("assets/fallback.ttf");
      if (!response.ok) throw new Error("Could not fetch fallback font: " + response.status);
      Mod.FS.writeFile("/fonts/fallback.ttf", new Uint8Array(await response.arrayBuffer()));
      fallbackFontLoaded = true;
    }

    // Filesystem errors carry only an errno, which says nothing about which of
    // several multi-gigabyte files failed or how far in. Name the call, the
    // file and the offset.
    function fsStep(description, fn) {
      try {
        return fn();
      } catch (error) {
        const detail = error && error.errno !== undefined
          ? `errno ${error.errno}`
          : String((error && error.message) || error);
        throw new Error(`${description}: ${detail}`);
      }
    }

    // Game files are loaded on demand (see Noberu/wasm/lazyfs.js). Each picked
    // file becomes a MEMFS placeholder under /game that reports its real size
    // (rlvm stat()s files before opening them) but holds no data. Opening one
    // has lazyFS.loadSync() read that single file in first.
    //
    // Loaded files are kept, most recently opened first, up to a budget; past
    // it, ones that are not open are dropped again and reread when next
    // opened. A phone's tab is killed long before a 5 GB game would fit.
    const touch = matchMedia("(hover: none) and (pointer: coarse)").matches;
    let lazyBudget = (touch ? 256 : 1024) * 1024 * 1024;

    function makeLazyFS(Mod) {
      const FS = Mod.FS;
      const loaded = new Map();  // node -> bytes, in order of last use
      let loadedBytes = 0;
      let evictions = 0;

      const nodeAt = (path) => {
        try {
          return FS.lookupPath(path, { follow: true }).node;
        } catch (error) {
          return null;
        }
      };

      function touchNode(node) {
        if (!loaded.has(node)) return;
        const bytes = loaded.get(node);
        loaded.delete(node);
        loaded.set(node, bytes);
      }

      function isOpen(node) {
        return FS.streams.some((stream) => stream && stream.node === node);
      }

      // `keep` is the file being opened right now: loaded, but not open yet,
      // so it would otherwise be the first thing dropped.
      function evict(keep = null) {
        for (const [node, bytes] of loaded) {
          if (loadedBytes <= lazyBudget) break;
          if (node === keep || isOpen(node)) continue;
          node.contents = null;
          node.lazyLoaded = false;
          loaded.delete(node);
          loadedBytes -= bytes;
          evictions++;
        }
      }

      // Synchronous, because the engine is mid-open() and cannot wait. A
      // synchronous XMLHttpRequest of a blob: URL is the one way a page can
      // read a File without yielding. Such requests may not ask for binary,
      // so the bytes come back as "x-user-defined" text, where each char code
      // is one byte (high bytes land at U+F780-U+F7FF; & 0xff recovers them).
      // Big files go in 8 MB pieces to keep the temporary string small.
      // Text decoding still sniffs for a byte order mark, which beats the
      // charset asked for: a piece starting EF BB BF lost those bytes and one
      // starting FF FE or FE FF came back as UTF-16. So every piece starts
      // with one zero byte, dropped again below.
      const SYNC_PIECE = 8 * 1024 * 1024;
      const SYNC_PAD = new Uint8Array(1);
      function readSync(file, relative) {
        const size = file.size;
        const bytes = new Uint8Array(size);
        for (let offset = 0; offset < size; offset += SYNC_PIECE) {
          const end = Math.min(offset + SYNC_PIECE, size);
          const url = URL.createObjectURL(new Blob([SYNC_PAD, file.slice(offset, end)]));
          try {
            const xhr = new XMLHttpRequest();
            xhr.open("GET", url, false);
            xhr.overrideMimeType("text/plain; charset=x-user-defined");
            xhr.send();
            const text = xhr.responseText;
            if (xhr.status !== 200 && xhr.status !== 0 || text.length !== end - offset + 1) {
              throw new Error(`read ${text.length - 1} of ${end - offset} bytes at ${offset}`);
            }
            for (let i = 1; i < text.length; i++) bytes[offset + i - 1] = text.charCodeAt(i) & 0xff;
          } catch (error) {
            throw new Error(`Could not read "${relative}": ${error.message || error}`);
          } finally {
            URL.revokeObjectURL(url);
          }
        }
        return bytes;
      }

      return {
        needs(path) {
          const node = nodeAt(path);
          return !!(node && node.lazyFile && !node.lazyLoaded);
        },
        loadSync(path) {
          const node = nodeAt(path);
          if (!node || !node.lazyFile || node.lazyLoaded) return;
          const bytes = readSync(node.lazyFile, path.replace(/^\/game\//, ""));
          node.contents = bytes;
          node.usedBytes = bytes.length;
          node.lazyLoaded = true;
          loaded.set(node, bytes.length);
          loadedBytes += bytes.length;
          evict(node);
        },
        // For debugging and tests.
        stats() {
          return { files: loaded.size, bytes: loadedBytes, budget: lazyBudget, evictions };
        },
        setBudget(bytes) {
          lazyBudget = bytes;
          evict();
        },
        opened(stream, flags) {
          const node = stream.node;
          if (!node.lazyFile) return;
          // Written to: it is no longer the picked file, so never drop it.
          if (flags & 3) {
            node.lazyFile = null;
            if (loaded.has(node)) {
              loadedBytes -= loaded.get(node);
              loaded.delete(node);
            }
            return;
          }
          touchNode(node);
        },
      };
    }

    // Creates /game's placeholders, preserving the folder's internal structure
    // but stripping the top-level folder name (rlvm expects Gameexe.ini etc
    // directly under the game root). Nothing is read here.
    function stageGameFiles(Mod, files) {
      const FS = Mod.FS;
      const prefix = files[0].webkitRelativePath
        ? files[0].webkitRelativePath.split("/")[0] + "/"
        : "";
      for (const file of files) {
        let relative = file.webkitRelativePath || file.name;
        if (prefix && relative.startsWith(prefix)) relative = relative.substring(prefix.length);
        if (!relative) continue;
        const path = "/game/" + relative;
        const directory = path.slice(0, path.lastIndexOf("/"));
        if (directory) FS.mkdirTree(directory);
        fsStep(`create "${relative}"`, () => FS.writeFile(path, new Uint8Array(0)));
        const node = FS.lookupPath(path).node;
        node.contents = null;
        node.usedBytes = file.size;
        node.lazyFile = file;
        node.lazyLoaded = false;
      }
      Mod.lazyFS = makeLazyFS(Mod);
    }

    let saveSyncIntervalId = null;
    function startPeriodicSaveSync(Mod) {
      // Sync IDBFS on a timer rather than hooking every C++ save-completion
      // call site: enough for "close the tab, come back later, your saves are
      // there".
      if (saveSyncIntervalId) return;
      saveSyncIntervalId = window.setInterval(() => {
        Mod.FS.syncfs(false, (err) => {
          if (err) console.error("IDBFS periodic sync failed", err);
        });
      }, 5000);

      window.addEventListener("beforeunload", () => {
        Mod.FS.syncfs(false, () => { });
      });
    }

    let booting = false;

    window.RLVMInstallAndBoot = async function (root, files) {
      if (booting) return;
      booting = true;

      try {
        if (!files || files.length === 0) throw new Error("No files were staged.");

        post("status", { text: "loading the rlvm engine..." });
        const Mod = await loadModule();

        post("status", { text: `staging ${files.length} files...` });
        stageGameFiles(Mod, files);
        await ensureFallbackFont(Mod);

        post("booting", {});
        // The game quit on its own (a title screen's Exit): the engine calls
        // this instead of tearing itself down. Saves go to IndexedDB now
        // rather than on the next timer tick, then the tab is told.
        Mod.onGameExit = () => {
          Mod.FS.syncfs(false, () => post("exited", {}));
        };
        // Debugging a late scene: sessionStorage "noberu.rlvm.seen" = a SEEN
        // number boots straight into it (rlvm's --start-seen).
        let seen = NaN;
        try { seen = parseInt(sessionStorage.getItem("noberu.rlvm.seen"), 10); } catch (error) { }
        // "noberu.rlvm.dump" = a SEEN number prints that scene's bytecode to the
        // console instead of playing (0: every scene, to /tmp/scenes.txt).
        let dump = NaN;
        try { dump = parseInt(sessionStorage.getItem("noberu.rlvm.dump"), 10); } catch (error) { }
        if (dump >= 0) {
          Mod.ccall("rlvm_dump_scene", null, ["string", "number"], ["/game", dump]);
          if (dump === 0) {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([Mod.FS.readFile("/tmp/scenes.txt")], { type: "text/plain" }));
            a.download = "scenes.txt";
            a.click();
          }
        }
        else if (seen > 0) {
          Mod.ccall("rlvm_start_at", null, ["string", "number"], ["/game", seen]);
          // "noberu.rlvm.ints" = "F1107=1,F1102=0": variables to set first.
          let ints = "";
          try { ints = sessionStorage.getItem("noberu.rlvm.ints") || ""; } catch (error) { }
          for (const [, bank, at, value] of ints.matchAll(/([A-Z])(\d+)=(-?\d+)/g)) {
            Mod.ccall("rlvm_set_int", null, ["number", "number", "number"], [bank.charCodeAt(0), +at, +value]);
          }
        }
        else Mod.ccall("rlvm_start", null, ["string"], ["/game"]);
        startPeriodicSaveSync(Mod);
        post("running", { root: root || "" });
      } catch (error) {
        console.error(error);
        showCrash(error);
        post("error", { message: String((error && error.message) || error) });
      } finally {
        booting = false;
      }
    };
  </script>
</body>

</html>
